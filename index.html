<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Planner</title>
<style>
:root{color-scheme:light;--paper:#fffdf6;--sticky:#fff4a8;--text:#2a2420;--muted:#6f655c;--line:#e7e0d4;--accent:#2f6fde;--accent-soft:#e8f0fd;--red:#c8372d;--red-soft:#fbe6e3;--amber:#a86a12;--amber-soft:#fdf0d8;--green:#2f8a50;--green-soft:#e3f3e8;--wood:#7a4a26;--hand:"Segoe Print","Bradley Hand","Marker Felt","Comic Sans MS",cursive}
*{box-sizing:border-box}
html{background:#ece6dc}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* wooden header */
header{background:var(--wood);background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.04) 0 3px,rgba(0,0,0,.05) 3px 7px,rgba(255,255,255,.02) 7px 13px);border-bottom:4px solid #5a3519;box-shadow:0 3px 8px rgba(0,0,0,.25);position:sticky;top:0;z-index:5}
.bar{max-width:1340px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--hand);font-size:21px;margin:0 8px 0 0;color:#fbefd9;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.22);padding:3px;border-radius:8px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:6px;color:#f3e3c8;font-weight:600}
.tab:hover{background:rgba(255,255,255,.1)}
.tab.active{background:var(--paper);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
.spacer{flex:1}
.search{border:1px solid #5a3519;border-radius:7px;padding:6px 10px;width:200px;background:var(--paper)}
.btn{border:1px solid #d9cfbf;background:var(--paper);padding:6px 12px;border-radius:7px;font-weight:600}
.btn:hover{background:#f4eee2}
.btn.primary{background:var(--accent);border-color:#1f56b5;color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--red)}
.menu{position:relative}
.menu-list{display:none;position:absolute;right:0;top:110%;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);min-width:210px;padding:4px;z-index:10}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu-list button:hover{background:#f4eee2}
/* cork board */
main{max-width:1340px;margin:18px auto;padding:30px 26px 40px;min-height:calc(100vh - 110px);
  background-color:#c69c6d;
  background-image:radial-gradient(rgba(70,40,15,.22) 1px,transparent 1.6px),radial-gradient(rgba(255,240,210,.18) 1px,transparent 1.6px),radial-gradient(rgba(110,65,25,.18) 2px,transparent 2.8px),radial-gradient(ellipse at 30% 20%,rgba(255,230,190,.25),transparent 60%);
  background-size:6px 6px,9px 9px,19px 19px,100% 100%;background-position:0 0,3px 4px,7px 11px,0 0;
  border:14px solid #8a5630;border-image:linear-gradient(135deg,#9a6438,#6e4122 40%,#94603a 70%,#5e371b) 1;
  box-shadow:inset 0 0 25px rgba(60,30,10,.45),0 6px 16px rgba(0,0,0,.25)}
@media (max-width:1380px){main{margin:18px 12px}}
/* push pin */
.pinned{position:relative}
.pinned::before{content:"";position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0 2px,transparent 3px),radial-gradient(circle at 50% 50%,var(--pin,#d64545) 0 60%,rgba(0,0,0,.35) 100%);
  box-shadow:1px 3px 3px rgba(0,0,0,.35);z-index:2}
.pinned::after{content:"";position:absolute;top:6px;left:50%;width:6px;height:6px;margin-left:-1px;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(1.5px)}
.banner{background:var(--sticky);border-radius:2px;padding:14px 16px 12px;margin:0 0 26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:2px 4px 8px rgba(0,0,0,.25);transform:rotate(-.4deg);--pin:#2f6fde}
.section-title{font-family:var(--hand);font-size:15px;color:var(--text);margin:26px 0 12px;display:inline-flex;align-items:center;gap:8px;background:var(--sticky);padding:3px 12px;box-shadow:1px 2px 4px rgba(0,0,0,.25);transform:rotate(-1deg)}
.section-title:first-child{margin-top:0}
.count{background:rgba(0,0,0,.1);color:var(--text);border-radius:9px;padding:0 7px;font-size:11px;font-family:-apple-system,"Segoe UI",sans-serif}
.panel{background:var(--paper);border-radius:2px;padding:10px 6px 6px;box-shadow:2px 4px 8px rgba(0,0,0,.25);transform:rotate(var(--tilt,.3deg))}
.empty{color:var(--muted);padding:14px;text-align:center}
.label{display:inline-block;background:var(--paper);padding:5px 12px;border-radius:2px;box-shadow:1px 2px 4px rgba(0,0,0,.25);font-size:12px;color:var(--muted)}
/* task rows */
.task{display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border-radius:5px;position:relative}
.task:hover{background:#f5efe2}
.task input[type=checkbox]{width:17px;height:17px;margin:1px 0 0;accent-color:var(--green);cursor:pointer;flex:none}
.task .body{flex:1;min-width:0}
.task .title{word-wrap:break-word}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task.just-done .title{animation:strike .5s ease forwards;background:linear-gradient(var(--muted),var(--muted)) no-repeat 0 55%/0 1.5px}
@keyframes strike{to{background-size:100% 1.5px;color:var(--muted)}}
.mini-star{color:#e5a800;font-size:13px;line-height:18px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:10px;background:#f1ebdf;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.due{padding:1px 7px;border-radius:10px;font-size:12px;background:#f1ebdf}
.due.overdue{background:var(--red-soft);color:var(--red);font-weight:600}
.due.today{background:var(--amber-soft);color:var(--amber);font-weight:600}
.due.soon{background:var(--accent-soft);color:var(--accent)}
.prio{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px}
.prio.High{background:var(--red-soft);color:var(--red)}
.prio.Low{background:#f1ebdf;color:var(--muted)}
.notes{font-size:12px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
.actions{display:flex;gap:2px;opacity:0;transition:opacity .1s}
.task:hover .actions,.task:focus-within .actions{opacity:1}
.icon{border:0;background:none;padding:2px 5px;border-radius:5px;color:var(--muted);font-size:14px;line-height:1}
.icon:hover{background:var(--line);color:var(--text)}
.icon.on{color:#e0a100}
.actions .icon.on{opacity:1}
/* today */
.today-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px}
.note-head{background:var(--sticky);padding:18px 20px 14px;margin-bottom:28px;max-width:560px;box-shadow:2px 4px 8px rgba(0,0,0,.25);transform:rotate(-.6deg);--pin:#2f8a50}
.note-head h2{margin:0 0 4px;font-size:22px;font-family:var(--hand)}
.progress{height:6px;background:rgba(0,0,0,.1);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--green);transition:width .4s}
.quick{display:flex;gap:6px;padding:8px}
.quick input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff}
.quick select{border:1px solid var(--line);border-radius:7px;padding:6px;max-width:150px;background:#fff}
/* board */
.board-tools{display:flex;gap:10px;align-items:center;margin-bottom:28px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 28px;align-items:start}
.card{background:var(--paper);border-radius:2px;display:flex;flex-direction:column;box-shadow:2px 5px 10px rgba(0,0,0,.28);transform:none;transition:transform .2s,box-shadow .2s;
  background-image:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,0) 52px,transparent 52px)}
.card:hover{transform:translateY(-2px);box-shadow:3px 8px 16px rgba(0,0,0,.3)}
.card .stripe{height:6px;margin:0 0 0;opacity:.85}
.card-head{padding:14px 14px 6px;display:flex;gap:8px;align-items:flex-start}
.card-head h3{margin:0;font-size:17px;flex:1;word-wrap:break-word;font-family:var(--hand);line-height:1.3}
.status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.status.Active{background:var(--green-soft);color:var(--green)}
.status.On-Hold{background:var(--amber-soft);color:var(--amber)}
.status.Done{background:#eee8dc;color:var(--muted)}
.card-sub{padding:0 14px 8px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.card-sub .progress{flex:1;min-width:60px}
.next{margin:0 10px 6px;padding:8px 10px;background:var(--sticky);border-left:4px solid var(--pin,#e0a100);font-size:13px}
.next b{color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.next.none{background:var(--green-soft);border-left-color:var(--green)}
.next.none b{color:var(--green)}
.card ul{list-style:none;margin:0;padding:0 6px}
.card li.dragging{opacity:.4}
.card li.drop-target{box-shadow:inset 0 2px 0 var(--accent)}
.card .handle{cursor:grab;color:#c2b8a8;padding-top:1px;user-select:none}
.toggle-done{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 14px;text-align:left}
.toggle-done:hover{color:var(--text)}
.card .quick{border-top:1px dashed #ddd3c2;margin-top:4px}
.card-notes{padding:0 14px 8px;font-size:12px;color:var(--muted);white-space:pre-wrap}
.card.party{animation:party 1.2s ease}
@keyframes party{0%{transform:rotate(0deg) scale(1)}20%{transform:rotate(-3deg) scale(1.06)}40%{transform:rotate(3deg) scale(1.06)}60%{transform:rotate(-2deg) scale(1.04)}100%{transform:rotate(0deg) scale(1)}}
/* dialog */
dialog{border:0;border-radius:4px;padding:0;width:min(480px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.35);background:var(--paper)}
dialog::backdrop{background:rgba(40,25,10,.4)}
dialog form{padding:20px}
dialog h2{margin:0 0 14px;font-size:19px;font-family:var(--hand)}
.field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=date],.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row .field{flex:1}
.check{display:flex;align-items:center;gap:7px;font-size:13px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block}
.swatches input{display:none}
.swatches input:checked+label{border-color:var(--text);box-shadow:inset 0 0 0 2px #fff}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dlg-actions .left{margin-right:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.help{font-size:12px;color:var(--muted)}
/* gold star sticker celebration */
.star-pop{position:fixed;width:0;height:0;z-index:60;pointer-events:none}
.star-pop svg{position:absolute;width:46px;height:46px;left:-23px;top:-23px;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.35));animation:starIn .55s cubic-bezier(.2,1.6,.4,1) forwards,starOut .45s ease-in .95s forwards}
@keyframes starIn{0%{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(-6deg)}}
@keyframes starOut{to{transform:translateY(-26px) scale(.5) rotate(-6deg);opacity:0}}
.sparkle{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#ffd23f;box-shadow:0 0 6px #ffd23f;animation:spark .7s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.cheer{position:absolute;left:28px;top:-34px;white-space:nowrap;background:#fff;color:var(--text);font-family:var(--hand);font-size:15px;font-weight:700;padding:4px 12px;border-radius:14px;box-shadow:1px 3px 8px rgba(0,0,0,.25);animation:cheer 1.4s ease forwards}
.cheer::after{content:"";position:absolute;left:-6px;bottom:6px;border:6px solid transparent;border-right-color:#fff;border-left:0}
@keyframes cheer{0%{opacity:0;transform:translateY(8px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.05)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
/* project complete party */
canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}
.party-note{position:fixed;top:90px;left:50%;z-index:80;width:min(380px,92vw);margin-left:calc(min(380px,92vw) / -2);background:var(--sticky);padding:24px 22px 18px;text-align:center;box-shadow:3px 8px 22px rgba(0,0,0,.35);--pin:#c8372d;animation:noteDrop .7s cubic-bezier(.2,1.4,.4,1) forwards}
.party-note h2{font-family:var(--hand);font-size:26px;margin:0 0 4px;color:var(--red)}
.party-note .pname{font-family:var(--hand);font-size:17px;margin-bottom:14px}
.party-note .stars{font-size:22px;color:#e5a800;letter-spacing:6px;margin-bottom:6px}
.party-note .btns{display:flex;gap:8px;justify-content:center}
.party-note.out{animation:noteOut .35s ease-in forwards}
@keyframes noteDrop{0%{transform:translateY(-160px) rotate(-12deg);opacity:0}100%{transform:translateY(0) rotate(-2deg);opacity:1}}
@keyframes noteOut{to{transform:translateY(-40px) rotate(4deg);opacity:0}}
/* project drag + push pin animation */
.board .card[data-project]:not([data-project=""]) .card-head{cursor:grab;touch-action:none}
body.moving-card{user-select:none;-webkit-user-select:none}
body.moving-card *{cursor:grabbing!important}
.card.lifted{position:fixed;z-index:90;margin:0;pointer-events:none;transform:rotate(2.5deg) scale(1.04);box-shadow:10px 22px 34px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s}
.card.lifted.settling{transform:rotate(0deg) scale(1.02);box-shadow:4px 10px 18px rgba(0,0,0,.3)}
.card.unpinning::before{animation:pinOut .4s ease forwards}
.card.unpinning::after,.card.lifted::after{display:none}
@keyframes pinOut{0%{transform:none;opacity:1}35%{transform:translateY(-12px) scale(1.25) rotate(-10deg);opacity:1}100%{transform:translate(26px,-40px) scale(1.1) rotate(35deg);opacity:0}}
.card.repinning::before{animation:pinIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pinIn{0%{transform:translateY(-40px) scale(1.6);opacity:0}55%{transform:translateY(3px) scale(.85);opacity:1}75%{transform:translateY(-1px) scale(1.05)}100%{transform:none}}
.card.repinning{animation:thunk .5s ease}
@keyframes thunk{0%,50%{transform:scale(1.02)}68%{transform:scale(.985) translateY(1px)}100%{transform:none}}
.card-slot{border:2px dashed rgba(255,250,235,.6);border-radius:4px;background:rgba(60,35,15,.12);position:relative}
.card-slot::before{content:"";position:absolute;top:-1px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:rgba(40,20,5,.65);box-shadow:0 0 0 1px rgba(255,240,210,.25)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
@media (max-width:800px){.today-grid{grid-template-columns:1fr}.search{width:100%}main{padding:24px 12px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Project Planner</h1>
    <nav class="tabs" role="tablist">
      <button class="tab" data-view="board">Board</button>
      <button class="tab" data-view="today">Today<span id="badge-today"></span></button>
      <button class="tab" data-view="due">Due Dates<span id="badge-due"></span></button>
    </nav>
    <div class="spacer"></div>
    <input class="search" id="search" type="search" placeholder="Search tasks...">
    <button class="btn" data-action="new-project">+ Project</button>
    <button class="btn primary" data-action="new-task">+ Task</button>
    <div class="menu" id="menu">
      <button class="btn" data-action="menu" aria-label="More options">&#8943;</button>
      <div class="menu-list">
        <button data-action="export">Export backup (JSON)</button>
        <button data-action="import">Import backup...</button>
        <button data-action="toggle-celebrate" id="celebrate-label">Turn celebrations off</button>
        <button data-action="load-sample">Load sample data</button>
        <button data-action="clear-all" style="color:var(--red)">Delete all data</button>
      </div>
    </div>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"><form id="dlg-form" method="dialog"></form></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var KEY='projectPlanner.data.v1', UIKEY='projectPlanner.ui.v1';
var COLORS=['#2f6fde','#2f9e5b','#d64545','#e0a100','#8b5cf6','#0ea5a4','#ec4899','#f97316','#64748b'];
var STATUSES=['Active','On Hold','Done'];
var PRIOS=['High','Med','Low'];
var PRIO_RANK={High:0,Med:1,Low:2};

/* ---------- utils ---------- */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return fmt(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return fmt(d)}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function dayDiff(s){return Math.round((parse(s)-parse(today()))/86400000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hash(s){s=String(s);var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
var PINS=['#d64545','#2f6fde','#2f9e5b','#e0a100','#8b5cf6'];
function pinStyle(seed,color){var n=hash(seed);return'--tilt:'+(((n%7)-3)*0.45).toFixed(2)+'deg;--pin:'+(color||PINS[n%PINS.length])}
function $(sel,root){return (root||document).querySelector(sel)}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1800)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ---------- state ---------- */
function emptyState(){return{version:1,isSample:false,projects:[],tasks:[]}}
function sampleState(){
  var p1=uid(),p2=uid(),p3=uid();
  var s={version:1,isSample:true,projects:[
    {id:p1,name:'Sample: Q4 Report',color:COLORS[0],status:'Active',due:addDays(9),notes:'Quarterly summary for leadership.',order:0},
    {id:p2,name:'Sample: Team Onboarding Guide',color:COLORS[1],status:'Active',due:addDays(20),notes:'',order:1},
    {id:p3,name:'Sample: Tool Evaluation',color:COLORS[4],status:'On Hold',due:'',notes:'Waiting on vendor pricing.',order:2}
  ],tasks:[]};
  var t=function(pid,title,due,prio,focus,done,order){s.tasks.push({id:uid(),projectId:pid,title:title,due:due,priority:prio,focus:!!focus,done:!!done,doneAt:done?addDays(-2):'',notes:'',order:order})};
  t(p1,'Collect metrics from dashboards',addDays(-1),'High',true,false,0);
  t(p1,'Draft summary section',addDays(2),'Med',true,false,1);
  t(p1,'Send draft to manager for review',addDays(6),'Med',false,false,2);
  t(p1,'Set up report template','', 'Low',false,true,3);
  t(p2,'Outline guide sections',addDays(0),'Med',false,false,0);
  t(p2,'Gather links to existing docs',addDays(4),'Low',false,false,1);
  t(p2,'Ask team for common questions',addDays(-3),'Med',false,true,2);
  t(p3,'Follow up with vendor',addDays(12),'Low',false,false,0);
  t(null,'Book time for 1:1 prep',addDays(1),'Med',false,false,0);
  return s;
}
function loadState(){
  var raw=lsGet(KEY);
  if(raw){try{var s=JSON.parse(raw);if(s&&Array.isArray(s.projects)&&Array.isArray(s.tasks))return s}catch(e){}}
  return sampleState();
}
var state=loadState();
var ui=(function(){try{return JSON.parse(lsGet(UIKEY))||{}}catch(e){return{}}})();
ui.view='board'; if(ui.celebrate===undefined)ui.celebrate=true; ui.expanded=ui.expanded||{}; ui.showDoneProjects=!!ui.showDoneProjects; ui.showDoneDue=!!ui.showDoneDue;
var query='';
function save(){if(!lsSet(KEY,JSON.stringify(state)))toast('Could not save. Is browser storage disabled?')}
function saveUI(){lsSet(UIKEY,JSON.stringify(ui))}
save();

function proj(id){for(var i=0;i<state.projects.length;i++)if(state.projects[i].id===id)return state.projects[i];return null}
function task(id){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)return state.tasks[i];return null}
function tasksOf(pid){return state.tasks.filter(function(t){return (t.projectId||null)===(pid||null)}).sort(function(a,b){return a.order-b.order})}
function nextStep(pid){var l=tasksOf(pid);for(var i=0;i<l.length;i++)if(!l[i].done)return l[i];return null}
function matches(t){
  if(!query)return true;
  var p=proj(t.projectId);
  return (t.title+' '+(t.notes||'')+' '+(p?p.name:'')).toLowerCase().indexOf(query)>-1;
}
function byDue(a,b){
  var ad=a.due||'9999',bd=b.due||'9999';
  if(ad!==bd)return ad<bd?-1:1;
  return PRIO_RANK[a.priority||'Med']-PRIO_RANK[b.priority||'Med'];
}

/* ---------- pieces ---------- */
function dueBadge(d,done){
  if(!d)return'';
  var n=dayDiff(d),cls='',label;
  if(n<0){label='Overdue '+(-n)+'d';cls=done?'':'overdue'}
  else if(n===0){label='Today';cls=done?'':'today'}
  else if(n===1){label='Tomorrow';cls=done?'':'soon'}
  else{label=parse(d).toLocaleDateString(undefined,{weekday:n<7?'short':undefined,month:'short',day:'numeric'});if(n<7&&!done)cls='soon'}
  return'<span class="due '+cls+'" title="'+esc(d)+'">'+esc(label)+'</span>';
}
function projChip(pid){
  var p=proj(pid);
  if(!p)return'<span class="chip"><span class="dot" style="background:#b8bec8"></span>No project</span>';
  return'<span class="chip"><span class="dot" style="background:'+esc(p.color)+'"></span>'+esc(p.name)+'</span>';
}
function taskRow(t,o){
  o=o||{};
  var h='<'+(o.li?'li':'div')+' class="task'+(t.done?' done':'')+'" data-task="'+t.id+'"'+(o.li&&!t.done?' draggable="true"':'')+'>';
  if(o.li&&!t.done)h+='<span class="handle" title="Drag to reorder">&#8942;&#8942;</span>';
  h+='<input type="checkbox" data-action="toggle" '+(t.done?'checked':'')+' aria-label="Mark complete">';
  if(t.done)h+='<span class="mini-star" title="Completed'+(t.doneAt?' '+esc(t.doneAt):'')+'">&#9733;</span>';
  h+='<div class="body"><div class="title">'+esc(t.title)+'</div><div class="meta">';
  if(o.showProject)h+=projChip(t.projectId);
  h+=dueBadge(t.due,t.done);
  if(t.priority&&t.priority!=='Med')h+='<span class="prio '+t.priority+'">'+t.priority+'</span>';
  if(o.next)h+='<span class="chip">Next step</span>';
  h+='</div>';
  if(t.notes&&o.showNotes)h+='<div class="notes">'+esc(t.notes)+'</div>';
  h+='</div><div class="actions">';
  if(!t.done)h+='<button class="icon'+(t.focus?' on':'')+'" data-action="focus" title="'+(t.focus?'Remove from Today':'Add to Today')+'">'+(t.focus?'&#9733;':'&#9734;')+'</button>';
  h+='<button class="icon" data-action="edit-task" title="Edit">&#9998;</button>';
  h+='<button class="icon" data-action="delete-task" title="Delete">&#10005;</button>';
  h+='</div></'+(o.li?'li':'div')+'>';
  return h;
}
function projectOptions(sel,allowNone){
  var h=allowNone?'<option value="">No project</option>':'';
  state.projects.filter(function(p){return p.status!=='Done'||p.id===sel}).sort(function(a,b){return a.order-b.order}).forEach(function(p){
    h+='<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>';
  });
  return h;
}
function quickAdd(kind,pid){
  return'<form class="quick" data-quick="'+kind+'"'+(pid!==undefined?' data-pid="'+(pid||'')+'"':'')+'>'+
    '<input name="title" placeholder="'+(kind==='focus'?'Add a task for today...':'Add a task...')+'" autocomplete="off">'+
    (kind==='focus'?'<select name="pid">'+projectOptions(null,true)+'</select>':'')+
    '<button class="btn small" type="submit">Add</button></form>';
}

/* ---------- views ---------- */
function renderToday(){
  var t0=today();
  var focus=state.tasks.filter(function(t){return t.focus&&(!t.done||t.doneAt===t0)&&matches(t)}).sort(function(a,b){return (a.done-b.done)||byDue(a,b)});
  var focusOpen=focus.filter(function(t){return!t.done});
  var doneToday=state.tasks.filter(function(t){return t.done&&t.doneAt===t0}).length;
  var ids={};focus.forEach(function(t){ids[t.id]=1});
  var overdue=[],dueToday=[],nexts=[];
  state.tasks.forEach(function(t){
    if(t.done||ids[t.id]||!matches(t))return;
    var p=proj(t.projectId);if(p&&p.status!=='Active')return;
    if(t.due&&t.due<t0)overdue.push(t);else if(t.due===t0)dueToday.push(t);
  });
  state.projects.filter(function(p){return p.status==='Active'}).forEach(function(p){
    var n=nextStep(p.id);if(n&&!ids[n.id]&&!(n.due&&n.due<=t0)&&matches(n))nexts.push(n);
  });
  overdue.sort(byDue);dueToday.sort(byDue);nexts.sort(byDue);
  var total=focus.length,doneF=total-focusOpen.length,pct=total?Math.round(doneF/total*100):0;
  var h='<div class="note-head pinned"><h2>'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</h2>'+
    '<div class="help" style="margin-bottom:8px">'+doneF+' of '+total+' focus tasks done &middot; '+doneToday+' completed today</div>'+
    '<div class="progress"><span style="width:'+pct+'%"></span></div></div>';
  h+='<div class="today-grid"><div><div class="section-title">My focus today <span class="count">'+focusOpen.length+'</span></div><div class="panel pinned" style="--tilt:-.3deg">';
  h+=focus.length?focus.map(function(t){return taskRow(t,{showProject:true,showNotes:true})}).join(''):'<div class="empty">Nothing planned yet. Star (&#9734;) tasks on the right or add one below.</div>';
  h+=quickAdd('focus')+'</div></div><div>';
  function block(title,list,help){
    h+='<div><div class="section-title">'+title+' <span class="count">'+list.length+'</span></div></div><div class="panel pinned" style="'+pinStyle(title)+'">';
    h+=list.length?list.map(function(t){return taskRow(t,{showProject:true})}).join(''):'<div class="empty">'+help+'</div>';
    h+='</div>';
  }
  block('Overdue',overdue,'Nothing overdue.');
  block('Due today',dueToday,'Nothing else due today.');
  block('Next steps on active projects',nexts,'No other next steps.');
  h+='</div></div>';
  return h;
}

function renderBoard(){
  var list=state.projects.slice().sort(function(a,b){return a.order-b.order});
  var hidden=list.filter(function(p){return p.status==='Done'}).length;
  if(!ui.showDoneProjects)list=list.filter(function(p){return p.status!=='Done'});
  var h='<div class="board-tools"><label class="check label" style="color:var(--text)"><input type="checkbox" data-action="show-done-projects" '+(ui.showDoneProjects?'checked':'')+'> Show completed projects'+(hidden?' ('+hidden+')':'')+'</label>'+
    '<span class="label">Drag a project by its title to move it. Drag tasks by the &#8942;&#8942; handle to reorder.</span></div><div class="board">';
  var inbox=tasksOf(null);
  var cards=list.map(function(p){return card(p)});
  if(inbox.length)cards.push(card(null));
  if(!cards.length)h+='<div class="panel empty" style="grid-column:1/-1">No projects yet. Click <b>+ Project</b> to add one.</div>';
  return h+cards.join('')+'</div>';
}
function card(p){
  var pid=p?p.id:null,key=pid||'_inbox';
  var all=tasksOf(pid),open=all.filter(function(t){return!t.done}),done=all.filter(function(t){return t.done});
  var vis=open.filter(matches),visDone=done.filter(matches);
  if(query&&!vis.length&&!visDone.length&&!(p&&p.name.toLowerCase().indexOf(query)>-1))return'';
  if(query&&p&&p.name.toLowerCase().indexOf(query)>-1){vis=open;visDone=done}
  var pct=all.length?Math.round(done.length/all.length*100):0;
  var n=open[0];
  var color=p?esc(p.color):'#9a9188';
  var h='<section class="card pinned" data-project="'+(pid||'')+'" style="'+pinStyle(key,color)+'"><div class="stripe" style="background:'+color+'"></div>';
  h+='<div class="card-head"><h3>'+(p?esc(p.name):'No project')+'</h3>';
  if(p)h+='<span class="status '+p.status.replace(' ','-')+'">'+p.status+'</span><button class="icon" data-action="edit-project" title="Edit project">&#9998;</button>';
  h+='</div><div class="card-sub">'+(p&&p.due?'Due '+dueBadge(p.due,p.status==='Done'):'')+
    '<div class="progress"><span style="width:'+pct+'%"></span></div><span>'+done.length+'/'+all.length+'</span></div>';
  if(p&&p.notes)h+='<div class="card-notes">'+esc(p.notes)+'</div>';
  if(p)h+=n?'<div class="next"><b>Next step</b>'+esc(n.title)+'</div>':'<div class="next none"><b>All caught up</b>Add the next task below.</div>';
  h+='<ul data-list="'+(pid||'')+'">'+vis.map(function(t){return taskRow(t,{li:true})}).join('')+'</ul>';
  if(visDone.length){
    var ex=!!ui.expanded[key];
    h+='<button class="toggle-done" data-action="toggle-expand" data-key="'+key+'">'+(ex?'&#9662; Hide':'&#9656; Show')+' '+visDone.length+' completed</button>';
    if(ex)h+='<ul>'+visDone.map(function(t){return taskRow(t,{li:true})}).join('')+'</ul>';
  }
  return h+quickAdd('card',pid)+'</section>';
}

function renderDue(){
  var t0=today(),wk=addDays(7);
  var groups=[['Overdue',[]],['Today',[]],['Next 7 days',[]],['Later',[]],['No due date',[]]];
  function put(item,d,done){
    if(!d)groups[4][1].push(item);
    else if(d<t0)groups[done?2:0][1].push(item);
    else if(d===t0)groups[1][1].push(item);
    else if(d<=wk)groups[2][1].push(item);
    else groups[3][1].push(item);
  }
  state.tasks.forEach(function(t){
    if(t.done&&!ui.showDoneDue)return;
    if(!matches(t))return;
    var p=proj(t.projectId);if(p&&p.status==='Done'&&!ui.showDoneDue)return;
    put({type:'task',t:t,due:t.due},t.due,t.done);
  });
  state.projects.forEach(function(p){
    if(!p.due||(p.status==='Done'&&!ui.showDoneDue))return;
    if(query&&p.name.toLowerCase().indexOf(query)<0)return;
    put({type:'project',p:p,due:p.due},p.due,p.status==='Done');
  });
  var h='<div class="board-tools"><label class="check label" style="color:var(--text)"><input type="checkbox" data-action="show-done-due" '+(ui.showDoneDue?'checked':'')+'> Show completed</label></div>';
  groups.forEach(function(g){
    if(!g[1].length&&g[0]!=='Today')return;
    g[1].sort(function(a,b){
      var ad=a.due||'9999',bd=b.due||'9999';if(ad!==bd)return ad<bd?-1:1;
      if(a.type!==b.type)return a.type==='project'?-1:1;
      return a.type==='task'?byDue(a.t,b.t):0;
    });
    h+='<div><div class="section-title">'+g[0]+' <span class="count">'+g[1].length+'</span></div></div><div class="panel pinned" style="'+pinStyle(g[0],g[0]==='Overdue'?'#d64545':null)+'">';
    h+=g[1].length?g[1].map(function(it){
      if(it.type==='task')return taskRow(it.t,{showProject:true,showNotes:true});
      var p=it.p;
      return'<div class="task" data-project="'+p.id+'"><span style="width:17px;text-align:center;color:'+esc(p.color)+'">&#9873;</span><div class="body"><div class="title"><b>Project deadline:</b> '+esc(p.name)+'</div><div class="meta">'+dueBadge(p.due,p.status==='Done')+'<span class="status '+p.status.replace(' ','-')+'">'+p.status+'</span></div></div><div class="actions"><button class="icon" data-action="edit-project" title="Edit project">&#9998;</button></div></div>';
    }).join(''):'<div class="empty">Nothing due today.</div>';
    h+='</div>';
  });
  return h;
}

function render(){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.view===ui.view)});
  var t0=today();
  var od=state.tasks.filter(function(t){var p=proj(t.projectId);return!t.done&&t.due&&t.due<t0&&!(p&&p.status==='Done')}).length;
  var fo=state.tasks.filter(function(t){return t.focus&&!t.done}).length;
  $('#badge-due').innerHTML=od?'<span class="badge" title="Overdue">'+od+'</span>':'';
  $('#badge-today').innerHTML=fo?'<span class="badge" style="background:var(--accent)" title="Open focus tasks">'+fo+'</span>':'';
  var h='';
  $('#celebrate-label').textContent=ui.celebrate?'Turn celebrations off':'Turn celebrations on';
  if(state.isSample&&!ui.hideBanner)h+='<div class="banner pinned"><span>You are looking at <b>sample data</b> so you can see how this works.</span><span class="spacer"></span><button class="btn small primary" data-action="clear-sample">Clear sample and start fresh</button><button class="btn small" data-action="hide-banner">Keep it for now</button></div>';
  h+=ui.view==='board'?renderBoard():ui.view==='due'?renderDue():renderToday();
  var main=$('#main'),y=window.scrollY;
  main.innerHTML=h;
  window.scrollTo(0,y);
}

/* ---------- dialogs ---------- */
var dlg=$('#dlg'),form=$('#dlg-form'),dlgSave=null;
function openDialog(html,onSave){form.innerHTML=html;dlgSave=onSave;dlg.showModal();var f=form.querySelector('input[type=text]');if(f){f.focus();f.select()}}
form.addEventListener('submit',function(e){
  var sub=e.submitter;
  if(sub&&sub.value==='cancel')return;
  if(sub&&sub.value==='delete')return;
  e.preventDefault();
  if(dlgSave&&dlgSave(new FormData(form))!==false){dlg.close();save();render()}
});
form.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.value==='cancel'){e.preventDefault();dlg.close()}
  if(b.value==='delete'){e.preventDefault();var fn=b._del||form._del;if(fn&&fn()){dlg.close();save();render()}}
});

function editTask(t,defaults){
  var isNew=!t;defaults=defaults||{};
  t=t||{title:'',projectId:defaults.projectId||(state.projects.filter(function(p){return p.status!=='Done'})[0]||{}).id||null,due:'',priority:'Med',focus:!!defaults.focus,notes:''};
  var h='<h2>'+(isNew?'New task':'Edit task')+'</h2>'+
    '<div class="field"><label>Task</label><input type="text" name="title" required value="'+esc(t.title)+'"></div>'+
    '<div class="field"><label>Project</label><select name="pid">'+projectOptions(t.projectId,true)+'</select></div>'+
    '<div class="row"><div class="field"><label>Due date</label><input type="date" name="due" value="'+esc(t.due)+'"></div>'+
    '<div class="field"><label>Priority</label><select name="priority">'+PRIOS.map(function(p){return'<option'+(p===t.priority?' selected':'')+'>'+p+'</option>'}).join('')+'</select></div></div>'+
    '<div class="field"><label>Notes</label><textarea name="notes">'+esc(t.notes)+'</textarea></div>'+
    '<label class="check"><input type="checkbox" name="focus" '+(t.focus?'checked':'')+'> Show in Today\'s focus list</label>'+
    '<div class="dlg-actions">'+(isNew?'':'<button class="btn danger left" value="delete">Delete</button>')+'<button class="btn" value="cancel">Cancel</button><button class="btn primary" value="save" type="submit">Save</button></div>';
  form._del=isNew?null:function(){return removeTask(t.id)};
  openDialog(h,function(fd){
    var title=String(fd.get('title')||'').trim();if(!title)return false;
    var pid=fd.get('pid')||null;
    if(isNew){t.id=uid();t.done=false;t.doneAt='';t.order=nextOrder(pid);state.tasks.push(t)}
    else if((t.projectId||null)!==pid)t.order=nextOrder(pid);
    t.title=title;t.projectId=pid;t.due=fd.get('due')||'';t.priority=fd.get('priority')||'Med';t.notes=String(fd.get('notes')||'');t.focus=!!fd.get('focus');
    toast(isNew?'Task added':'Task saved');
  });
}
function editProject(p){
  var isNew=!p;
  p=p||{name:'',color:COLORS[state.projects.length%COLORS.length],status:'Active',due:'',notes:''};
  var sw=COLORS.map(function(c,i){return'<input type="radio" name="color" id="c'+i+'" value="'+c+'"'+(c===p.color?' checked':'')+'><label for="c'+i+'" style="background:'+c+'"></label>'}).join('');
  var h='<h2>'+(isNew?'New project':'Edit project')+'</h2>'+
    '<div class="field"><label>Project name</label><input type="text" name="name" required value="'+esc(p.name)+'"></div>'+
    '<div class="row"><div class="field"><label>Status</label><select name="status">'+STATUSES.map(function(s){return'<option'+(s===p.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'+
    '<div class="field"><label>Deadline</label><input type="date" name="due" value="'+esc(p.due)+'"></div></div>'+
    '<div class="field"><label>Color</label><div class="swatches">'+sw+'</div></div>'+
    '<div class="field"><label>Notes</label><textarea name="notes">'+esc(p.notes)+'</textarea></div>'+
    '<div class="dlg-actions">'+(isNew?'':'<button class="btn danger left" value="delete">Delete project</button>')+'<button class="btn" value="cancel">Cancel</button><button class="btn primary" value="save" type="submit">Save</button></div>';
  form._del=isNew?null:function(){return removeProject(p.id)};
  openDialog(h,function(fd){
    var name=String(fd.get('name')||'').trim();if(!name)return false;
    if(isNew){p.id=uid();p.order=state.projects.length?Math.max.apply(null,state.projects.map(function(x){return x.order}))+1:0;state.projects.push(p)}
    p.name=name;p.status=fd.get('status');p.due=fd.get('due')||'';p.color=fd.get('color')||p.color;p.notes=String(fd.get('notes')||'');
    toast(isNew?'Project added':'Project saved');
  });
}
function nextOrder(pid){var l=tasksOf(pid);return l.length?l[l.length-1].order+1:0}
function removeTask(id){
  var t=task(id);if(!t||!confirm('Delete task "'+t.title+'"?'))return false;
  state.tasks=state.tasks.filter(function(x){return x.id!==id});toast('Task deleted');return true;
}
function removeProject(id){
  var p=proj(id),n=tasksOf(id).length;if(!p)return false;
  if(!confirm('Delete project "'+p.name+'"'+(n?' and its '+n+' task(s)':'')+'? This cannot be undone.'))return false;
  state.projects=state.projects.filter(function(x){return x.id!==id});
  state.tasks=state.tasks.filter(function(t){return t.projectId!==id});
  toast('Project deleted');return true;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var menu=$('#menu');
  if(!e.target.closest('#menu'))menu.classList.remove('open');
  var tab=e.target.closest('.tab');
  if(tab){ui.view=tab.dataset.view;saveUI();render();window.scrollTo(0,0);return}
  var el=e.target.closest('[data-action]');if(!el||el.closest('dialog'))return;
  var a=el.dataset.action,row=el.closest('[data-task]'),t=row?task(row.dataset.task):null;
  var prow=el.closest('[data-project]'),p=prow?proj(prow.dataset.project):null;
  switch(a){
    case 'menu':menu.classList.toggle('open');break;
    case 'new-task':editTask(null,{focus:ui.view==='today'});break;
    case 'new-project':editProject(null);break;
    case 'focus':if(t){t.focus=!t.focus;save();render();toast(t.focus?'Added to Today':'Removed from Today')}break;
    case 'edit-task':if(t)editTask(t);break;
    case 'delete-task':if(t&&removeTask(t.id)){save();render()}break;
    case 'edit-project':if(p)editProject(p);break;
    case 'toggle-expand':ui.expanded[el.dataset.key]=!ui.expanded[el.dataset.key];saveUI();render();break;
    case 'clear-sample':if(confirm('Remove all sample projects and tasks?')){state=emptyState();save();render();toast('Ready for your projects')}break;
    case 'toggle-celebrate':menu.classList.remove('open');ui.celebrate=!ui.celebrate;saveUI();render();toast(ui.celebrate?'Celebrations on':'Celebrations off');break;
    case 'hide-banner':ui.hideBanner=true;saveUI();render();break;
    case 'load-sample':menu.classList.remove('open');if(confirm('Replace your current data with sample data? Export a backup first if you want to keep it.')){state=sampleState();ui.hideBanner=false;save();saveUI();render()}break;
    case 'clear-all':menu.classList.remove('open');if(confirm('Delete ALL projects and tasks? Export a backup first if you want to keep them.')){state=emptyState();save();render();toast('All data deleted')}break;
    case 'export':menu.classList.remove('open');doExport();break;
    case 'import':menu.classList.remove('open');$('#file').value='';$('#file').click();break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;if(el.closest('dialog'))return;
  var a=el.dataset.action;
  if(a==='toggle'){
    var t=task(el.closest('[data-task]').dataset.task);if(!t)return;
    t.done=el.checked;t.doneAt=t.done?today():'';
    save();
    if(!t.done){render();return}
    var p=proj(t.projectId);
    var projectDone=p&&p.status!=='Done'&&tasksOf(p.id).every(function(x){return x.done});
    if(!ui.celebrate){if(projectDone)toast('Project complete: '+p.name);render();return}
    var rowEl=el.closest('[data-task]');if(rowEl)rowEl.classList.add('just-done');
    goldStar(el);
    setTimeout(function(){render();if(projectDone)projectParty(p)},900);
  }else if(a==='show-done-projects'){ui.showDoneProjects=el.checked;saveUI();render()}
  else if(a==='show-done-due'){ui.showDoneDue=el.checked;saveUI();render()}
});
document.addEventListener('submit',function(e){
  var f=e.target;if(!f.dataset||!f.dataset.quick)return;
  e.preventDefault();
  var title=f.querySelector('[name=title]').value.trim();if(!title)return;
  var pid=f.dataset.quick==='focus'?(f.querySelector('[name=pid]').value||null):(f.dataset.pid||null);
  state.tasks.push({id:uid(),projectId:pid,title:title,due:'',priority:'Med',focus:f.dataset.quick==='focus',done:false,doneAt:'',notes:'',order:nextOrder(pid)});
  save();render();
  var again=document.querySelector('form[data-quick="'+f.dataset.quick+'"]'+(f.dataset.quick==='card'?'[data-pid="'+(pid||'')+'"]':'')+' input[name=title]');
  if(again)again.focus();
});
$('#search').addEventListener('input',function(e){query=e.target.value.trim().toLowerCase();render()});
document.addEventListener('keydown',function(e){
  if(e.target.matches('input,textarea,select')||dlg.open)return;
  if(e.key==='n'){e.preventDefault();editTask(null,{focus:ui.view==='today'})}
  else if(e.key==='/'){e.preventDefault();$('#search').focus()}
  else if(e.key==='1'||e.key==='2'||e.key==='3'){ui.view=['board','today','due'][+e.key-1];saveUI();render()}
});

/* drag and drop on board */
var dragId=null;
document.addEventListener('dragstart',function(e){var li=e.target.closest&&e.target.closest('li[data-task]');if(!li)return;dragId=li.dataset.task;li.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragend',function(){dragId=null;document.querySelectorAll('.dragging,.drop-target').forEach(function(x){x.classList.remove('dragging','drop-target')})});
document.addEventListener('dragover',function(e){
  if(!dragId)return;var c=e.target.closest('.card');if(!c)return;e.preventDefault();
  document.querySelectorAll('.drop-target').forEach(function(x){x.classList.remove('drop-target')});
  var li=e.target.closest('li[data-task]');if(li&&li.dataset.task!==dragId)li.classList.add('drop-target');
});
document.addEventListener('drop',function(e){
  if(!dragId)return;var c=e.target.closest('.card');if(!c)return;e.preventDefault();
  var t=task(dragId);if(!t)return;
  var pid=c.dataset.project||null;
  var li=e.target.closest('li[data-task]'),before=li&&li.dataset.task!==dragId?li.dataset.task:null;
  var list=tasksOf(pid).filter(function(x){return x.id!==t.id});
  var idx=before?list.findIndex(function(x){return x.id===before}):list.filter(function(x){return!x.done}).length;
  if(idx<0)idx=list.length;
  list.splice(idx,0,t);t.projectId=pid;
  list.forEach(function(x,i){x.order=i});
  dragId=null;save();render();
});

/* drag projects around the board */
var cardDrag=null;
function flip(fn){
  var board=document.querySelector('.board');if(!board){fn();return}
  var cards=[].slice.call(board.querySelectorAll('.card:not(.lifted)')),first=cards.map(function(c){return c.getBoundingClientRect()});
  fn();
  cards.forEach(function(c,i){
    var a=first[i],b=c.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(!dx&&!dy)return;
    c.style.transition='none';c.style.transform='translate('+dx+'px,'+dy+'px)';
    requestAnimationFrame(function(){requestAnimationFrame(function(){c.style.transition='transform .25s ease';c.style.transform='';setTimeout(function(){c.style.transition=''},300)})});
  });
}
document.addEventListener('pointerdown',function(e){
  if(e.button!==0||cardDrag)return;
  var head=e.target.closest('.board .card-head');if(!head||e.target.closest('button,input,select,a'))return;
  var card=head.closest('.card');if(!card.dataset.project)return;
  e.preventDefault();
  cardDrag={card:card,sx:e.clientX,sy:e.clientY,started:false};
});
document.addEventListener('pointermove',function(e){
  var d=cardDrag;if(!d)return;
  if(!d.started){
    if(Math.abs(e.clientX-d.sx)+Math.abs(e.clientY-d.sy)<6)return;
    var r=d.card.getBoundingClientRect();
    d.ox=d.sx-r.left;d.oy=d.sy-r.top;
    d.ph=document.createElement('div');d.ph.className='card-slot';d.ph.style.height=r.height+'px';
    d.card.parentNode.insertBefore(d.ph,d.card);
    d.card.style.width=r.width+'px';d.card.style.left=r.left+'px';d.card.style.top=r.top+'px';
    d.card.classList.add('lifted','unpinning');
    document.body.classList.add('moving-card');d.started=true;
  }
  e.preventDefault();
  d.card.style.left=(e.clientX-d.ox)+'px';d.card.style.top=(e.clientY-d.oy)+'px';
  if(e.clientY<60)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,14);
  var el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest('.board .card:not(.lifted)');
  if(!t)return;
  var tr=t.getBoundingClientRect(),ref=(!t.dataset.project||e.clientX<tr.left+tr.width/2)?t:t.nextSibling;
  if(ref===d.ph||ref===d.ph.nextSibling)return;
  flip(function(){t.parentNode.insertBefore(d.ph,ref)});
});
function dropCard(){
  var d=cardDrag;cardDrag=null;if(!d||!d.started)return;
  var pr=d.ph.getBoundingClientRect(),c=d.card;
  c.style.transition='left .22s ease,top .22s ease,transform .22s ease,box-shadow .22s ease';
  c.classList.add('settling');c.style.left=pr.left+'px';c.style.top=pr.top+'px';
  setTimeout(function(){
    d.ph.parentNode.replaceChild(c,d.ph);
    c.style.width=c.style.left=c.style.top=c.style.transition='';
    c.classList.remove('lifted','settling','unpinning');
    void c.offsetWidth;c.classList.add('repinning');
    setTimeout(function(){c.classList.remove('repinning')},550);
    document.body.classList.remove('moving-card');
    var ids=[].slice.call(document.querySelectorAll('.board .card[data-project]')).map(function(x){return x.dataset.project}).filter(Boolean);
    var orders=ids.map(function(id){return proj(id).order}).sort(function(a,b){return a-b});
    for(var i=1;i<orders.length;i++)if(orders[i]<=orders[i-1])orders[i]=orders[i-1]+1;
    ids.forEach(function(id,i){proj(id).order=orders[i]});
    save();
  },230);
}
document.addEventListener('pointerup',dropCard);
document.addEventListener('pointercancel',dropCard);

/* celebrations */
var REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var CHEERS=['Nice work!','One down!','Way to go!','Crushed it!','Done and done!','Look at you go!','Great job!','Checked off!'];
function goldStar(anchor){
  var r=anchor.getBoundingClientRect();
  var w=document.createElement('div');w.className='star-pop';
  w.style.left=(r.left+r.width/2)+'px';w.style.top=(r.top+r.height/2)+'px';
  w.innerHTML='<svg viewBox="0 0 24 24"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe36e"/><stop offset=".55" stop-color="#f5b800"/><stop offset="1" stop-color="#d99100"/></linearGradient></defs><path d="M12 1.8l3.1 6.4 7 1-5.1 4.9 1.2 7-6.2-3.3-6.2 3.3 1.2-7L1.9 9.2l7-1z" fill="url(#sg)" stroke="#b77a00" stroke-width=".8" stroke-linejoin="round"/><path d="M8.6 7.6l1.1-.2.8-1.6" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".8"/></svg>';
  if(!REDUCE)for(var i=0;i<10;i++){
    var s=document.createElement('span');s.className='sparkle';
    var a=i/10*Math.PI*2,d=30+Math.random()*22;
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'px');s.style.setProperty('--dy',(Math.sin(a)*d).toFixed(1)+'px');
    s.style.background=i%2?'#ffd23f':'#fff3b0';
    w.appendChild(s);
  }
  var n=state.tasks.filter(function(x){return x.done&&x.doneAt===today()}).length;
  var c=document.createElement('span');c.className='cheer';
  c.textContent=(n>1&&n%5===0)?n+' done today!':CHEERS[Math.floor(Math.random()*CHEERS.length)];
  if(r.left>window.innerWidth-180){c.style.left='auto';c.style.right='28px'}
  w.appendChild(c);
  document.body.appendChild(w);
  setTimeout(function(){w.remove()},1500);
}
function confetti(){
  if(REDUCE)return;
  var cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  var dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;var ctx=cv.getContext('2d');if(!ctx){cv.remove();return}ctx.scale(dpr,dpr);
  var cols=['#d64545','#2f6fde','#2f9e5b','#f5b800','#8b5cf6','#ec4899','#0ea5a4','#f97316'],P=[];
  for(var i=0;i<220;i++){
    var burst=i<80,side=i%2;
    P.push(burst?{x:side?W+10:-10,y:H*0.75,vx:(side?-1:1)*(6+Math.random()*9),vy:-(9+Math.random()*9),r:Math.random()*6,vr:(Math.random()-.5)*.4,w:6+Math.random()*5,h:9+Math.random()*7,c:cols[i%cols.length],star:i%9===0}
              :{x:Math.random()*W,y:-20-Math.random()*H*0.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:6+Math.random()*5,h:9+Math.random()*7,c:cols[i%cols.length],star:i%9===0});
  }
  var start=performance.now();
  function star(x,y,s){ctx.beginPath();for(var k=0;k<10;k++){var rr=k%2?s*.45:s,a=k*Math.PI/5-Math.PI/2;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
  (function frame(now){
    var t=now-start;ctx.clearRect(0,0,W,H);
    ctx.globalAlpha=t>3600?Math.max(0,1-(t-3600)/600):1;
    P.forEach(function(p){
      p.vy+=0.18;p.vx*=0.985;p.vy=Math.min(p.vy,5.5);p.x+=p.vx+Math.sin((t/300)+p.r)*0.6;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.star){ctx.fillStyle='#f5b800';star(0,0,7)}else{ctx.scale(1,Math.abs(Math.cos(p.r*1.7))+.2);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
      ctx.restore();
    });
    if(t<4200)requestAnimationFrame(frame);else cv.remove();
  })(start);
}
function projectParty(p){
  confetti();
  var card=document.querySelector('.card[data-project="'+p.id+'"]');
  if(card){card.classList.remove('party');void card.offsetWidth;card.classList.add('party')}
  var old=document.querySelector('.party-note');if(old)old.remove();
  var n=document.createElement('div');n.className='party-note pinned';
  n.innerHTML='<div class="stars">&#9733;&#9733;&#9733;</div><h2>Project complete!</h2><div class="pname">'+esc(p.name)+'</div>'+
    '<div class="help" style="margin-bottom:12px">Every task is checked off. Want to mark the whole project as Done?</div>'+
    '<div class="btns"><button class="btn primary" data-party="done">Mark project Done</button><button class="btn" data-party="keep">Keep it active</button></div>';
  document.body.appendChild(n);
  var timer=setTimeout(close,12000);
  function close(){clearTimeout(timer);n.classList.add('out');setTimeout(function(){n.remove()},350)}
  n.addEventListener('click',function(e){
    var b=e.target.closest('[data-party]');if(!b)return;
    if(b.dataset.party==='done'){p.status='Done';save();render();toast('Project marked Done')}
    close();
  });
}

/* import / export */
function doExport(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-planner-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  toast('Backup downloaded');
}
$('#file').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var s=JSON.parse(r.result);
      if(!s||!Array.isArray(s.projects)||!Array.isArray(s.tasks))throw new Error('bad');
      if(!confirm('Replace your current data with "'+f.name+'" ('+s.projects.length+' projects, '+s.tasks.length+' tasks)?'))return;
      state=s;state.isSample=false;save();render();toast('Backup imported');
    }catch(err){alert('That file does not look like a Project Planner backup.')}
  };
  r.readAsText(f);
});
window.addEventListener('storage',function(e){if(e.key===KEY){state=loadState();render()}});

render();
})();
</script>
